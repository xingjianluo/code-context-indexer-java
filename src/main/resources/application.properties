# 随机端口，避免本地冲突
server.port=0

# ===== 本地代码上下文索引器配置（cci.*） =====
# 被索引的本地代码根目录（绝对/相对路径均可，需可读）。
# 留空时必须在 POST /api/index/refresh?root=... 中显式指定。
# 服务只绑定一个根目录，切换根目录会被拒绝（返回 409）。
cci.root=

# 允许索引的文本文件扩展名（小写、不含点，逗号分隔）。
# 不在列表内的文件不会静默跳过：以 UNSUPPORTED_EXTENSION 原因进入拒绝列表。
cci.supported-extensions=java,txt,md,properties,xml,yml,yaml,json,js,ts,css,html,sql,sh,csv

# 单个文件允许的最大字节数；超过则以 TOO_LARGE 拒绝（默认 1 MiB）。
cci.max-file-bytes=1048576

# 遍历时直接跳过的目录名（配置策略，不产生拒绝记录）。
cci.exclude-dirs=.git,target,build,node_modules,.idea

# 上下文片段中每个命中行上下各取的行数。
cci.snippet-context-lines=2

# 多个片段拼接时的分隔符（按 Unicode 码点计入预算）。
cci.fragment-separator=\n---\n
